apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: demo
  labels:
    app: traffic-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
    spec:
      containers:
        - name: traffic-gen
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              while true; do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://frontend:8080/);
                echo "$(date -Iseconds) HTTP $code";
                sleep 0.5;
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
