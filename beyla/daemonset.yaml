---
# ConfigMap: Beyla configuration file
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: beyla
data:
  beyla-config.yaml: |
    # Beyla Phase-0 configuration
    # system_wide: true bypasses the PID-namespace-inode-based CommonPIDsFilter,
    # which fails on WSL2 because bpf_get_ns_current_pid_tgid() returns Namespace:1
    # (inode 1, invalid) instead of the real PID namespace inode (e.g. 4026533185).
    # IdentityPidsFilter is used instead and accepts all captured eBPF spans.
    discovery:
      system_wide: true
      exclude_instrument:
        - k8s_namespace: kube-system
        - k8s_namespace: monitoring

    # Kubernetes metadata enrichment
    attributes:
      kubernetes:
        enable: true

    # Network (L4) metrics
    network:
      enable: true
      print_flows: false

    # Prometheus exporter
    prometheus_export:
      port: 9090
      path: /metrics

    # Logging
    log_level: debug
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: beyla
  labels:
    app: beyla
spec:
  selector:
    matchLabels:
      app: beyla
  template:
    metadata:
      labels:
        app: beyla
    spec:
      serviceAccountName: beyla
      # eBPF requires host PID and network namespaces
      hostPID: true
      hostNetwork: true

      tolerations:
        - operator: Exists  # run on all nodes including control-plane taints

      initContainers:
        # Raise RLIMIT_MEMLOCK to unlimited so Beyla can create eBPF maps.
        # K3s/containerd caps it at 64 MiB by default; eBPF tracing needs more.
        # We use a busybox initContainer to call prlimit on the shared PID namespace.
        - name: memlock-init
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Current memlock:"; cat /proc/self/limits | grep "Max locked"
              ulimit -l unlimited || true
              echo "After ulimit:"; cat /proc/self/limits | grep "Max locked"
          securityContext:
            privileged: true
            runAsUser: 0

      volumes:
        - name: beyla-config
          configMap:
            name: beyla-config
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc

      containers:
        - name: beyla
          image: grafana/beyla:2.1.0
          imagePullPolicy: IfNotPresent

          securityContext:
            privileged: true   # required to load eBPF programs
            runAsUser: 0
            capabilities:
              add:
                - SYS_RESOURCE  # allows setrlimit(RLIMIT_MEMLOCK, RLIM_INFINITY)
                - BPF           # explicit BPF capability (kernel 5.8+)

          env:
            # Point to the config file mounted from ConfigMap
            - name: BEYLA_CONFIG_PATH
              value: /etc/beyla/beyla-config.yaml
            # Make node name available for k8s metadata
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "autodetect"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.node.name=$(NODE_NAME)"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          volumeMounts:
            - name: beyla-config
              mountPath: /etc/beyla
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true

          ports:
            - name: metrics
              containerPort: 9090
              hostPort: 9090   # since hostNetwork=true, port is on the host

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
