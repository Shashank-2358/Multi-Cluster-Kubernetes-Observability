apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape Beyla pods by discovering pods in the beyla namespace
      - job_name: 'beyla'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - beyla
        relabel_configs:
          # Keep only pods with app=beyla label
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: beyla
            action: keep
          # Use pod IP + beyla metrics port 9090
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:9090"
          # Carry k8s metadata through as labels
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node

      # Scrape Prometheus itself for meta-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
