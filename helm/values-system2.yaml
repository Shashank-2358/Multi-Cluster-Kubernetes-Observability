# System-2 (Your Cluster — WSL2) — Edge Node
# Runs demo microservices + Grafana Beyla eBPF
# Exposes Beyla metrics on NodePort 30090 for System-3 to scrape

sampleApps:
  enabled: true

# HPA enabled on this cluster — pods scale with k6 traffic load
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  cpuTargetPercent: 50

beyla:
  enabled: true
  service:
    nodePort: 30090

# Monitoring storage and UI are disabled on edge nodes
prometheus:
  enabled: false

grafana:
  enabled: false
