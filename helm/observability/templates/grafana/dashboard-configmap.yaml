{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-phase0
  namespace: monitoring
data:
  phase0.json: |
    {
      "id": null,
      "uid": "phase0-beyla",
      "title": "Phase 0 — Beyla L4 + L7 Observability",
      "description": "Single-cluster PoC: Grafana Beyla eBPF metrics via Prometheus",
      "tags": ["beyla", "phase0", "ebpf"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "15s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "L4 · Network Flow Bytes/sec",
          "description": "Rate of bytes observed in network flows captured by Beyla eBPF",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(beyla_network_flow_bytes_total[1m])",
              "legendFormat": "{{`{{direction}} {{k8s_src_owner_name}}→{{k8s_dst_owner_name}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "L7 · HTTP Request Rate (req/sec)",
          "description": "Inbound HTTP request rate captured by Beyla without code changes",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count[1m])) by (service_name, url_path)",
              "legendFormat": "{{`{{service_name}} {{url_path}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "L7 · HTTP Request Duration p50 / p95 / p99",
          "description": "HTTP server latency percentiles from Beyla histogram",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name))",
              "legendFormat": "p50 {{`{{service_name}}`}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name))",
              "legendFormat": "p95 {{`{{service_name}}`}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name))",
              "legendFormat": "p99 {{`{{service_name}}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "L7 · HTTP Error Rate (5xx/sec)",
          "description": "HTTP 5xx error rate — zero in a healthy system",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[1m])) by (service_name, http_response_status_code) or vector(0)",
              "legendFormat": "{{`{{service_name}} HTTP {{http_response_status_code}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.01 }
                ]
              }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        }
      ]
    }
{{- end }}
