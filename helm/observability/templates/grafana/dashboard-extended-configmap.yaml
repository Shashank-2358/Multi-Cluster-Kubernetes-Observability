{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-extended
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  extended.json: |-
    {
      "id": null,
      "uid": "extended-beyla",
      "title": "Phase 0 — Extended L4 + L7 Metrics",
      "description": "Additional Beyla eBPF metrics: TCP RTT, retransmissions, packets (L4) · client latency, active requests, body size (L7)",
      "tags": ["beyla", "phase0", "ebpf", "extended"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [

        {
          "id": 10,
          "type": "row",
          "title": "L4 — TCP Network Metrics",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }
        },

        {
          "id": 11,
          "type": "timeseries",
          "title": "L4 · TCP Round-Trip Time (RTT) p50 / p95 / p99",
          "description": "TCP RTT histogram between pod pairs captured by eBPF fentry/tcp_rcv_established. High RTT indicates network congestion or cross-node latency.",
          "gridPos": { "x": 0, "y": 1, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(beyla_network_flow_rtt_seconds_bucket{k8s_src_namespace=\"demo\"}[2m])) by (le, k8s_src_owner_name, k8s_dst_owner_name))",
              "legendFormat": "p50 {{`{{k8s_src_owner_name}}`}}→{{`{{k8s_dst_owner_name}}`}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(beyla_network_flow_rtt_seconds_bucket{k8s_src_namespace=\"demo\"}[2m])) by (le, k8s_src_owner_name, k8s_dst_owner_name))",
              "legendFormat": "p95 {{`{{k8s_src_owner_name}}`}}→{{`{{k8s_dst_owner_name}}`}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(beyla_network_flow_rtt_seconds_bucket{k8s_src_namespace=\"demo\"}[2m])) by (le, k8s_src_owner_name, k8s_dst_owner_name))",
              "legendFormat": "p99 {{`{{k8s_src_owner_name}}`}}→{{`{{k8s_dst_owner_name}}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },

        {
          "id": 12,
          "type": "timeseries",
          "title": "L4 · TCP Retransmissions/sec",
          "description": "Rate of TCP retransmitted segments per pod-pair flow. Sustained retransmissions indicate packet loss, congestion, or unstable links.",
          "gridPos": { "x": 0, "y": 9, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(beyla_network_flow_retransmissions_total{k8s_src_namespace=\"demo\"}[1m])) by (k8s_src_owner_name, k8s_dst_owner_name)",
              "legendFormat": "{{`{{k8s_src_owner_name}}`}}→{{`{{k8s_dst_owner_name}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 13,
          "type": "timeseries",
          "title": "L4 · Network Packets/sec",
          "description": "Rate of packets sent per pod-pair flow (beyla_network_flow_packets_total). Useful for spotting asymmetric traffic or unexpected burst patterns.",
          "gridPos": { "x": 12, "y": 9, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(beyla_network_flow_packets_total{k8s_src_namespace=\"demo\"}[1m])) by (k8s_src_owner_name, k8s_dst_owner_name)",
              "legendFormat": "{{`{{k8s_src_owner_name}}`}}→{{`{{k8s_dst_owner_name}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 20,
          "type": "row",
          "title": "L7 — HTTP Application Metrics",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 17, "w": 24, "h": 1 }
        },

        {
          "id": 21,
          "type": "timeseries",
          "title": "L7 · HTTP Client Latency p50 / p95 / p99 (outbound per-hop)",
          "description": "Client-side HTTP call duration from Beyla's http_client_request_duration_seconds histogram. Shows outbound latency as seen by each service (frontend's view of backend, backend's view of auth). Compare against server-side p99 to isolate network vs. server processing time.",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_client_request_duration_seconds_bucket{service_namespace=\"demo\"}[5m])) by (le, service_name))",
              "legendFormat": "p50 {{`{{service_name}}`}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_client_request_duration_seconds_bucket{service_namespace=\"demo\"}[5m])) by (le, service_name))",
              "legendFormat": "p95 {{`{{service_name}}`}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_client_request_duration_seconds_bucket{service_namespace=\"demo\"}[5m])) by (le, service_name))",
              "legendFormat": "p99 {{`{{service_name}}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },

        {
          "id": 22,
          "type": "timeseries",
          "title": "L7 · HTTP Server Active Requests (in-flight concurrency)",
          "description": "Gauge of HTTP requests currently being processed on each service (http_server_active_requests). A sustained high value relative to normal indicates a concurrency backlog or slow upstream.",
          "gridPos": { "x": 0, "y": 27, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(http_server_active_requests{service_namespace=\"demo\"}) by (service_name)",
              "legendFormat": "{{`{{service_name}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 12 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 50 }
                ]
              }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 23,
          "type": "timeseries",
          "title": "L7 · HTTP Request Body Size p50 / p95 / p99",
          "description": "Inbound HTTP request body size distribution (http_server_request_body_size_bytes histogram). Helps detect unexpectedly large payloads that might strain memory or throughput.",
          "gridPos": { "x": 12, "y": 27, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_body_size_bytes_bucket{service_namespace=\"demo\"}[5m])) by (le, service_name))",
              "legendFormat": "p50 {{`{{service_name}}`}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_body_size_bytes_bucket{service_namespace=\"demo\"}[5m])) by (le, service_name))",
              "legendFormat": "p95 {{`{{service_name}}`}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_body_size_bytes_bucket{service_namespace=\"demo\"}[5m])) by (le, service_name))",
              "legendFormat": "p99 {{`{{service_name}}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        }

      ]
    }
{{- end }}
