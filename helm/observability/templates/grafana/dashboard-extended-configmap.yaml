{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-extended
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  extended.json: |-
    {
      "id": null,
      "uid": "extended-beyla",
      "title": "Phase 0 — Extended L4 + L7 Metrics",
      "description": "Multi-Cluster eBPF Telemetry: L4 Network socket flows and L7 HTTP RED metrics across System-1 and System-2",
      "tags": ["beyla", "phase0", "ebpf", "extended", "multicluster"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 3,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "type": "query",
            "label": "Cluster",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(beyla_network_flow_bytes_total, cluster)",
            "query": {
              "query": "label_values(beyla_network_flow_bytes_total, cluster)",
              "refId": "ClusterVar"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "refresh": 1,
            "sort": 1
          }
        ]
      },
      "panels": [

        {
          "id": 10,
          "type": "row",
          "title": "L4 — Network Layer Metrics (eBPF Socket Flows)",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }
        },

        {
          "id": 11,
          "type": "timeseries",
          "title": "L4 · Network Throughput (Bytes/sec)",
          "description": "Total network throughput observed on socket layers by Beyla eBPF across communicating endpoints.",
          "gridPos": { "x": 0, "y": 1, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(beyla_network_flow_bytes_total{cluster=~\"$cluster\"}[1m])) by (cluster, k8s_src_owner_name, k8s_dst_owner_name)",
              "legendFormat": "[{{`{{cluster}}`}}] {{`{{k8s_src_owner_name}} → {{k8s_dst_owner_name}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 12,
          "type": "timeseries",
          "title": "L4 · Flow Direction Breakdown (Request vs Response Bytes)",
          "description": "Aggregated data volume separated into inbound request bytes and outbound response bytes.",
          "gridPos": { "x": 12, "y": 1, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(beyla_network_flow_bytes_total{cluster=~\"$cluster\"}[1m])) by (cluster, direction)",
              "legendFormat": "[{{`{{cluster}}`}}] {{`{{direction}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 13,
          "type": "timeseries",
          "title": "L4 · Network Bandwidth (Bits/sec)",
          "description": "Instantaneous network bandwidth utilization calculated from socket byte flows (* 8).",
          "gridPos": { "x": 0, "y": 9, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(beyla_network_flow_bytes_total{cluster=~\"$cluster\"}[1m])) by (cluster) * 8",
              "legendFormat": "[{{`{{cluster}}`}}] Bandwidth",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 12 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 14,
          "type": "stat",
          "title": "L4 · Monitored Pods",
          "description": "Count of distinct pods/workloads actively observed by Beyla eBPF (unique k8s_dst_owner_name with non-zero traffic in the last 1m). Should equal the number of running demo pods.",
          "gridPos": { "x": 12, "y": 9, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(count by (k8s_dst_owner_name) (rate(beyla_network_flow_bytes_total{cluster=~\"$cluster\", k8s_dst_owner_name!=\"\"}[1m]) > 0)) by (cluster) or vector(0)",
              "legendFormat": "[{{`{{cluster}}`}}] Monitored Pods",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green",  "value": 3 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },

        {
          "id": 20,
          "type": "row",
          "title": "L7 — HTTP Application Metrics (eBPF HTTP Traces)",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 1 }
        },

        {
          "id": 21,
          "type": "timeseries",
          "title": "L7 · HTTP Request Rate per Hop (req/sec)",
          "description": "Inbound HTTP request throughput captured per microservice hop across the full frontend -> backend -> auth chain.",
          "gridPos": { "x": 0, "y": 17, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_namespace=\"demo\", cluster=~\"$cluster\"}[1m])) by (cluster, server_address, http_route)",
              "legendFormat": "[{{`{{cluster}}`}}] {{`{{server_address}} {{http_route}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean"] } }
        },

        {
          "id": 22,
          "type": "timeseries",
          "title": "L7 · Per-Hop Mean Latency Comparison (auth vs backend vs frontend)",
          "description": "Average response latency per service hop. Visualizes how latency accumulates across the proxy chain.",
          "gridPos": { "x": 12, "y": 17, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(sum(rate(http_server_request_duration_seconds_sum{service_namespace=\"demo\", cluster=~\"$cluster\"}[1m])) by (cluster, server_address) / sum(rate(http_server_request_duration_seconds_count{service_namespace=\"demo\", cluster=~\"$cluster\"}[1m])) by (cluster, server_address)) * 1000",
              "legendFormat": "[{{`{{cluster}}`}}] mean {{`{{server_address}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },

        {
          "id": 23,
          "type": "timeseries",
          "title": "L7 · HTTP Latency Percentiles (p50 / p95 / p99)",
          "description": "HTTP latency percentiles computed across all demo services from Beyla's duration histograms.",
          "gridPos": { "x": 0, "y": 25, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_duration_seconds_bucket{service_namespace=\"demo\", cluster=~\"$cluster\"}[5m])) by (le, cluster, server_address))",
              "legendFormat": "[{{`{{cluster}}`}}] p50 {{`{{server_address}}`}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{service_namespace=\"demo\", cluster=~\"$cluster\"}[5m])) by (le, cluster, server_address))",
              "legendFormat": "[{{`{{cluster}}`}}] p95 {{`{{server_address}}`}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{service_namespace=\"demo\", cluster=~\"$cluster\"}[5m])) by (le, cluster, server_address))",
              "legendFormat": "[{{`{{cluster}}`}}] p99 {{`{{server_address}}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },

        {
          "id": 24,
          "type": "timeseries",
          "title": "L7 · HTTP Response Status Codes (2xx / 4xx / 5xx)",
          "description": "Distribution of HTTP status codes emitted by each service hop.",
          "gridPos": { "x": 12, "y": 25, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_namespace=\"demo\", cluster=~\"$cluster\"}[1m])) by (cluster, server_address, http_response_status_code)",
              "legendFormat": "[{{`{{cluster}}`}}] {{`{{server_address}} HTTP {{http_response_status_code}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        }

      ]
    }
{{- end }}
