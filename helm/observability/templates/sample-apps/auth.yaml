{{- if .Values.sampleApps.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: demo
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from auth"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: demo
  labels:
    app: auth
spec:
  selector:
    app: auth
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
