{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
{{- if .Values.prometheus.remoteClusters }}
{{- range .Values.prometheus.remoteClusters }}
      # Remote scrape job for cluster: {{ .name }}
      - job_name: 'beyla-{{ .name }}'
        static_configs:
          - targets: ['{{ .target }}']
            labels:
              cluster: '{{ .name }}'
        metric_relabel_configs:
          - source_labels: [__name__, service_namespace]
            regex: 'http_server_request_duration_seconds.*;(|kube-system|kube-node-lease|monitoring|beyla|default)'
            action: drop
{{- end }}
{{- else }}
      # Local cluster scrape (standalone mode)
      - job_name: 'beyla'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - beyla
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: beyla
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:9090"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
        metric_relabel_configs:
          - source_labels: [__name__, service_namespace]
            regex: 'http_server_request_duration_seconds.*;(|kube-system|kube-node-lease|monitoring|beyla|default)'
            action: drop
{{- end }}

      # Scrape Prometheus itself for meta-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
{{- end }}
