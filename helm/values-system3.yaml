# System-3 (Central Monitoring Server)
# Runs Central Prometheus TSDB + Central Grafana Dashboards
# Scrapes metrics centrally from System-1 and System-2 over the network (Option A)

sampleApps:
  enabled: false

beyla:
  enabled: false

prometheus:
  enabled: true
  remoteClusters:
    - name: System-1
      # Tailscale IP — stable across all networks, never changes
      target: "100.121.118.12:30090"

    - name: System-2
      # Tailscale IP — stable across all networks, never changes
      target: "100.67.50.8:30090"

grafana:
  enabled: true
